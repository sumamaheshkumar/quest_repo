include:
  - resources/*.yml

bundle:
  name: rearc_data_quest

variables:
  catalog:
    default: workspace
  schema:
    default: rearc
  raw_root:
    default: /Volumes/workspace/rearc/raw
  notification_email:
    default: kotlasy@mail.uc.edu

workspace:
  host: https://dbc-793184b6-7857.cloud.databricks.com
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  include:
    - src/pipelines/**
    - src/operations/**
    - tests/validate_gold.py
  exclude:
    - .venv/**
    - "**/__pycache__/**"
    - dashboards/*.png

resources:
  pipelines:
    rearc_pipeline:
      name: rearc_data_quest
      catalog: ${var.catalog}
      schema: ${var.schema}
      channel: CURRENT
      serverless: true
      photon: true
      continuous: false
      root_path: ${workspace.file_path}/src/pipelines
      libraries:
        - glob:
            include: ${workspace.file_path}/src/pipelines/**
      configuration:
        rearc.raw_root: ${var.raw_root}
      notifications:
        - alerts:
            - on-update-fatal-failure
          email_recipients:
            - ${var.notification_email}

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/kotlasy@mail.uc.edu/.bundle/${bundle.name}/${bundle.target}